# The whole pipeline lives in the platform's reusable workflow (golden path).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: 0019-KDU/platform-golden-paths/.github/workflows/ecs-service.yml@v1.0.0
    with:
      service-name: shop-api
      language: node
      test-command: npm run test:ci
      postgres: true
